<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Landscape phone: lock out pinch-zoom and double-tap-zoom at the viewport level. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120a1e">
<meta name="apple-mobile-web-app-title" content="Kingdom Kids">
<!-- A family game: keep it out of search engines. -->
<meta name="robots" content="noindex, nofollow">
<title>Kingdom Kids</title>
<!-- Home-screen web app (iPhone: Share > Add to Home Screen). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #120a1e;
    overflow: hidden;
    /* No pull-to-refresh, no rubber-band scroll. */
    overscroll-behavior: none;
    /* No browser gesture handling at all -- Phaser owns every touch. */
    touch-action: none;
    -ms-touch-action: none;
    /* No text selection or long-press callout. */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Kept inside the iPhone's safe area (notch, home bar) so no button ends
     up under them -- with viewport-fit=cover the page itself runs edge to edge. */
  #game {
    position: fixed;
    top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
    touch-action: none;
  }
  #game canvas { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }

  /* Ask for landscape rather than rendering something unusable. */
  #rotate {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #120a1e; color: #cdd3e6; z-index: 10;
    font: 600 18px/1.5 system-ui, -apple-system, sans-serif;
    text-align: center; padding: 24px;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">Turn your phone sideways&nbsp;↻</div>

<!-- Pinned. Do not float this version. -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<script>
// Gesture suppression. `touch-action: none` plus the viewport meta already
// kill pinch-zoom, double-tap-zoom and pull-to-refresh on their own; these
// handlers only cover iOS Safari's proprietary gesture events.
//
// Deliberately NOT here: a blanket preventDefault on touchmove/touchend. Doing
// that to touches that started on the canvas can make iOS fire pointercancel
// mid-gesture, which drops a held finger and makes the d-pad stick or die.
// Anything outside the canvas is still suppressed.
(function () {
  var stop = function (e) { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
    document.addEventListener(n, stop, { passive: false });
  });
  document.addEventListener('contextmenu', stop);
  document.addEventListener('touchmove', function (e) {
    if (e.target && e.target.tagName === 'CANVAS') return;   // let Phaser own it
    e.preventDefault();
  }, { passive: false });
})();
</script>

<script src="js/characters.js"></script>
<script src="js/level.js"></script>
<script src="js/controls.js"></script>
<script src="js/fx.js"></script>
<script src="js/heartless.js"></script>
<script src="js/hyena.js"></script>
<script src="js/mover.js"></script>
<script src="js/companion.js"></script>
<script src="js/scene-preload.js"></script>
<script src="js/scene-select.js"></script>
<script src="js/scene-worlds.js"></script>
<script src="js/scene-play.js"></script>
<script src="js/main.js"></script>
<script>
// Fit the game to what's really on screen. An iPhone home-screen app can
// misreport its size after turning sideways (and leave the page shifted), so a
// canvas fitted to the CSS box hangs off the screen -- the MENU button with
// it. The box is sized here from the visible area (visualViewport), minus the
// notch and home-bar insets, and re-fitted a few times while a rotation settles.
(function () {
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
    'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  var fit = function () {
    var box = document.getElementById('game');
    if (!box) return;
    var cs = getComputedStyle(probe), px = function (v) { return parseFloat(v) || 0; };
    var t = px(cs.paddingTop), r = px(cs.paddingRight), b = px(cs.paddingBottom), l = px(cs.paddingLeft);
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
    var ox = vv ? vv.offsetLeft : 0, oy = vv ? vv.offsetTop : 0;
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);   // undo a leftover shift
    box.style.left = (ox + l) + 'px'; box.style.top = (oy + t) + 'px';
    box.style.right = 'auto'; box.style.bottom = 'auto';
    box.style.width = Math.max(0, w - l - r) + 'px'; box.style.height = Math.max(0, h - t - b) + 'px';
    // Only once Phaser has booted (before that there's no canvas to fit, and
    // it measures the box itself when it boots).
    if (window.GAME && GAME.game && GAME.game.isBooted && GAME.game.scale && GAME.game.scale.canvas) {
      try {
        GAME.game.scale.getParentBounds();      // re-measure the box first, or refresh() reuses the old size
        GAME.game.scale.refresh();
      } catch (e) { /* never let fitting break the game */ }
    }
  };
  var soon = function () { fit(); setTimeout(fit, 150); setTimeout(fit, 500); setTimeout(fit, 1200); };
  window.addEventListener('orientationchange', soon);
  window.addEventListener('resize', soon);
  window.addEventListener('pageshow', soon);
  document.addEventListener('visibilitychange', soon);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', soon);
    window.visualViewport.addEventListener('scroll', soon);
  }
  soon();
  GAME.fit = soon;              // main.js calls this once the game exists
  // And in case no event comes at all: once a second, re-fit if the box no
  // longer matches what's visible.
  GAME.fitCheck = function () {
    var box = document.getElementById('game'), vv = window.visualViewport;
    if (!box) return false;
    var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
    var r = box.getBoundingClientRect();
    if (r.right > w + 2 || r.bottom > h + 2 || r.left < -2 || r.top < -2 || r.width < w * 0.6) { fit(); return true; }
    return false;
  };
  setInterval(GAME.fitCheck, 1000);
})();

// Offline play for the home-screen app. Only over https (GitHub Pages), so
// the local dev server never serves stale cached files.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
